<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandacaru de Letras</title>
<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #F7EFE0;
    --card: #EFE3CE;
    --card-light: #FFF9EB;
    --ink: #3D2314;
    --muted: #7C6350;
    --terra: #7A3B1E;
    --terra-warm: #9E4722;
    --olive: #5C683C;
    --border: #E2D1B7;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }

  .ui-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .ui-icon svg {
    display: block;
  }

  /* SHELL PRINCIPAL */
  .app-shell {
    max-width: 1120px;
    margin: 0 auto;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 248px 1fr;
  }

  .sidebar {
    background: #F2E6D2;
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .brand-emblem {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    margin-bottom: 24px;
  }

  .brand-title {
    font-family: Georgia, serif;
    font-weight: 800;
    font-size: 16px;
    line-height: 1.08;
    color: var(--ink);
  }

  .brand-title small {
    display: block;
    font-family: system-ui, sans-serif;
    font-size: 9.5px;
    letter-spacing: 1.7px;
    color: var(--olive);
    margin-top: 2px;
  }

  .side-nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .side-nav button {
    border: 0;
    background: transparent;
    color: var(--ink);
    font: 600 14.5px/1.2 system-ui, sans-serif;
    padding: 11px 13px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, color 0.15s;
  }

  .side-nav button:hover,
  .side-nav button.active {
    background: #E5D4B8;
    color: var(--terra);
  }

  .cta-add {
    margin-top: 14px;
    background: var(--terra) !important;
    color: #FFF9EB !important;
    border: 0;
    border-radius: 13px;
    padding: 12px !important;
    font-weight: 700 !important;
    cursor: pointer;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(122, 59, 30, 0.22);
  }

  .sidebar-footer {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
  }

  .main-content {
    padding: 22px clamp(14px, 4vw, 40px) 98px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }

  .mobile-bottom-nav {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #F4E8D3;
    border-top: 1px solid var(--border);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    z-index: 60;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 -4px 16px rgba(61, 35, 20, 0.08);
  }

  .nav-tab {
    background: transparent;
    border: 0;
    color: var(--muted);
    font: 600 11px system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
  }

  .nav-tab.active {
    color: var(--terra);
  }

  .center-plus-wrap {
    position: relative;
    top: -15px;
  }

  .center-plus-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--terra);
    color: #FFF9EB;
    border: 3px solid var(--bg);
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(122, 59, 30, 0.35);
  }

  @media (max-width: 850px) {
    .app-shell { display: block; }
    .sidebar { display: none; }
    .mobile-bottom-nav { display: flex; }
  }

  /* TOAST & BOTÕES */
  .toast-box {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(18px);
    background: var(--ink);
    color: #FFF9EB;
    padding: 10px 20px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 8px 22px rgba(34, 18, 9, 0.28);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 9999;
  }
  .toast-box.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .btn-pill {
    border: 0;
    border-radius: 99px;
    padding: 10px 20px;
    background: var(--terra);
    color: #FFF9EB;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    box-shadow: 0 4px 12px rgba(122, 59, 30, 0.2);
    transition: transform 0.14s, opacity 0.14s;
  }
  .btn-pill:hover { transform: translateY(-1px); opacity: 0.96; }
  .btn-pill.soft { background: var(--card-light); color: var(--ink); border: 1px solid var(--border); box-shadow: none; }
  .btn-pill.olive { background: var(--olive); }
  .serif { font-family: Georgia, serif; }

  /* BANNER DE BOAS-VINDAS BOTÂNICO */
  .welcome-banner {
    position: relative;
    border-radius: 26px;
    padding: 22px 20px 22px;
    margin-bottom: 8px;
    background: linear-gradient(125deg, #F3E5CE 0%, #EFE0C6 56%, #E5CEAC 100%);
    border: 1px solid #DFCBB0;
    box-shadow: 0 10px 26px rgba(61, 35, 20, 0.07), inset 0 1px 0 #FFF9EE;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .welcome-banner-copy {
    position: relative;
    z-index: 3;
    max-width: 74%;
  }

  .welcome-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--olive);
    background: rgba(255, 249, 235, 0.85);
    padding: 4px 10px;
    border-radius: 99px;
    border: 1px solid #E2D1B7;
    margin-bottom: 8px;
  }

  .welcome-banner h1 {
    margin: 0;
    font-family: Georgia, serif;
    font-size: clamp(28px, 6vw, 37px);
    line-height: 1.06;
    letter-spacing: -0.6px;
    color: var(--ink);
  }

  .welcome-banner p {
    margin: 6px 0 13px;
    color: #6B523F;
    font-size: 14px;
    line-height: 1.42;
  }

  .welcome-chips {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .streak-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #FFF9EB;
    border: 1px solid #DFCBB0;
    border-radius: 99px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 700;
    color: var(--terra);
  }

  .welcome-art-scene {
    position: absolute;
    right: 0;
    bottom: 0;
    top: 0;
    width: 185px;
    pointer-events: none;
    z-index: 1;
  }

  .bell-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid #DFCBB0;
    background: rgba(255, 249, 235, 0.92);
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    position: relative;
    z-index: 4;
    align-self: flex-start;
    box-shadow: 0 4px 12px rgba(61, 35, 20, 0.08);
  }

  .bell-dot {
    position: absolute;
    top: 9px;
    right: 10px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--terra-warm);
    border: 1.5px solid #FFF9EB;
  }

  /* SEÇÕES & CARDS DA HOME */
  .section-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 22px 0 10px;
  }
  .section-row h2 {
    margin: 0;
    font-family: Georgia, serif;
    font-size: 19.5px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .link-more {
    border: 0;
    background: transparent;
    color: var(--terra);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  .continue-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 15px;
    display: flex;
    gap: 15px;
    align-items: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(61, 35, 20, 0.04);
  }

  .botanical-corner {
    position: absolute;
    right: 4px;
    bottom: -4px;
    width: 54px;
    height: 70px;
    pointer-events: none;
    opacity: 0.85;
  }

  .book-cover-box {
    width: 94px;
    height: 136px;
    border-radius: 10px;
    flex: none;
    position: relative;
    overflow: hidden;
    box-shadow: 3px 6px 12px rgba(45, 24, 12, 0.24);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px;
    color: #FFF9EB;
    font-family: Georgia, serif;
  }

  .book-cover-box img,
  .shelf-item img,
  .detail-cover img,
  .fav-grid-card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 3;
  }

  .svg-cover-art {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .progress-track {
    flex: 1;
    height: 7px;
    border-radius: 99px;
    background: #DFCDAE;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--terra);
    border-radius: 99px;
  }
  .progress-pct {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
  }

  .journey-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 17px 10px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    text-align: center;
  }
  .journey-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .journey-col + .journey-col {
    border-left: 1px solid #DECAA9;
  }
  .journey-col strong {
    font-family: Georgia, serif;
    font-size: 17.5px;
    font-weight: 800;
    color: var(--ink);
  }
  .journey-col span {
    font-size: 12px;
    color: var(--muted);
  }

  /* ESTANTE DE MADEIRA 3D */
  .wooden-shelf-box {
    position: relative;
    margin-top: 14px;
    padding: 18px 14px 16px;
    border-radius: 14px;
    background: linear-gradient(180deg, #9C6134 0%, #834D25 8%, #73411D 84%, #573014 87%, #965D32 94%, #5E3518 100%);
    box-shadow: 0 12px 22px rgba(61, 35, 20, 0.22), inset 0 2px 4px rgba(255, 226, 184, 0.35), inset 0 -4px 8px rgba(38, 19, 8, 0.45);
    border: 4px solid #6E3E1C;
  }
  .shelf-hanging-vine {
    position: absolute;
    left: -6px;
    top: -10px;
    width: 78px;
    height: 115px;
    pointer-events: none;
    z-index: 6;
  }
  .shelf-potted-plant {
    position: absolute;
    right: 12px;
    top: -26px;
    width: 34px;
    height: 36px;
    pointer-events: none;
    z-index: 6;
  }
  .shelf-row-books {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 11px;
    align-items: end;
  }
  .shelf-item {
    aspect-ratio: 2 / 3;
    border-radius: 7px;
    position: relative;
    overflow: hidden;
    box-shadow: 3px 6px 12px rgba(28, 14, 6, 0.42);
    cursor: pointer;
    transition: transform 0.2s;
  }
  .shelf-item:hover {
    transform: translateY(-5px);
  }
  .shelf-plank-divider {
    height: 14px;
    margin: 14px -14px 16px;
    background: linear-gradient(180deg, #A3683B 0%, #7C4822 55%, #552E13 100%);
    box-shadow: 0 6px 10px rgba(32, 16, 7, 0.4);
  }

  .quick-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
  }
  .quick-tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 13px 6px;
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: transform 0.15s, background 0.15s;
  }
  .quick-tile:hover {
    transform: translateY(-2px);
    background: #E7D7BC;
  }
  .quick-tile span {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.15;
  }

  .activity-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 14px 15px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .activity-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #D7B48E;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 13px;
    flex: none;
    color: var(--ink);
  }

  /* TOPBAR, BIBLIOTECA & DETALHES */
  .detail-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .icon-circle {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    flex: none;
  }

  .search-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 14px;
    margin: 10px 0;
  }
  .search-pill input {
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    width: 100%;
    outline: none;
  }

  .filter-pills {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin: 10px 0 14px;
  }
  .filter-pills button {
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 8px 15px;
    background: var(--card);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .filter-pills button.active {
    background: var(--terra);
    border-color: var(--terra);
    color: #FFF9EB;
  }

  .detail-hero {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 16px;
  }
  .detail-cover {
    width: 126px;
    height: 184px;
    border-radius: 14px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 24px rgba(52, 27, 13, 0.25);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 14px;
    color: #FFF9EB;
    font-family: Georgia, serif;
    flex: none;
  }

  .genre-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 10px 0 14px;
  }
  .genre-tag {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 99px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
  }

  .detail-actions-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 12px;
  }
  .detail-act-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 11px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
  }
  .detail-act-btn.favorited {
    background: #F4DEC8;
    border-color: var(--terra);
    color: var(--terra);
  }

  /* PERFIL CLEAN (INSTAGRAM + SKOOB) */
  .profile-card {
    background: var(--card-light);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(61, 35, 20, 0.06);
    margin-bottom: 18px;
  }
  .profile-cover {
    height: 136px;
    position: relative;
    background-size: cover;
    background-position: center;
  }
  .profile-cover-btn {
    position: absolute;
    right: 12px;
    top: 12px;
    background: rgba(61, 35, 20, 0.62);
    color: #FFF9EB;
    border: 1px solid rgba(255, 249, 235, 0.28);
    backdrop-filter: blur(6px);
    border-radius: 99px;
    padding: 5px 11px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .profile-header-body {
    padding: 0 18px 18px;
    position: relative;
  }
  .profile-avatar-row {
    display: flex;
    justify-content: flex-start;
    align-items: flex-end;
    margin-top: -42px;
    margin-bottom: 10px;
  }
  .profile-avatar-wrap {
    position: relative;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 4px solid var(--card-light);
    background: linear-gradient(145deg, #E8D5B7, #D5BC96);
    box-shadow: 0 6px 16px rgba(61, 35, 20, 0.14);
    display: grid;
    place-items: center;
  }
  .profile-avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }
  .profile-avatar-initials {
    font-family: Georgia, serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--terra);
    letter-spacing: 0.5px;
  }
  .profile-avatar-edit {
    position: absolute;
    right: -1px;
    bottom: -1px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--terra);
    color: #FFF9EB;
    border: 2px solid var(--card-light);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .profile-name-block h2 {
    margin: 0;
    font-family: Georgia, serif;
    font-size: 21px;
    color: var(--ink);
  }
  .profile-handle {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    margin: 2px 0 8px;
  }
  .profile-bio {
    margin: 0 0 14px;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ink);
  }
  .profile-actions-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .profile-actions-row .btn-pill {
    width: 100%;
    padding: 9px 12px;
    font-size: 12.5px;
  }

  .profile-stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 11px 6px;
    text-align: center;
    margin-bottom: 12px;
  }
  .profile-stat-item + .profile-stat-item {
    border-left: 1px solid #DECAA9;
  }
  .profile-stat-item strong {
    display: block;
    font-family: Georgia, serif;
    font-size: 16.5px;
    color: var(--ink);
  }
  .profile-stat-item span {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }

  .skoob-meter-box {
    background: #F4E7D2;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 13px;
  }
  .ig-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 2px solid var(--border);
    margin: 14px 0;
  }
  .ig-tab-btn {
    background: transparent;
    border: 0;
    padding: 11px 8px;
    font-weight: 700;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .ig-tab-btn.active {
    color: var(--terra);
    border-bottom-color: var(--terra);
  }

  .fav-ig-grid {
    display: grid;

function createDynamicCoverSvg(title, author, paletteIdx = 0) {
  const palettes = [
    { bg: '#C86032', sun: '#F5C469', text: '#FFF9EB' },
    { bg: '#5C683C', sun: '#F3E5CA', text: '#FFF9EB' },
    { bg: '#1F3649', sun: '#F6D58E', text: '#F8E7CD' }
  ];
  const p = palettes[paletteIdx % palettes.length];
  const shortTitle = esc(title.length > 26 ? title.slice(0, 24) + '…' : title);
  const shortAuthor = esc((author || 'Literatura').toUpperCase().slice(0, 24));
  return `<svg class="svg-cover-art" viewBox="0 0 200 300" preserveAspectRatio="xMidYMid slice">
    <rect width="200" height="300" fill="${p.bg}"/>
    <circle cx="100" cy="172" r="36" fill="${p.sun}" opacity="0.25"/>
    <foreignObject x="16" y="34" width="168" height="84">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color:${p.text};font-family:Georgia,serif;font-weight:700;font-size:17px;line-height:1.18;text-align:center">${shortTitle}</div>
    </foreignObject>
    <text x="100" y="276" text-anchor="middle" fill="${p.sun}" font-family="sans-serif" font-size="9" letter-spacing="1.1">${shortAuthor}</text>
  </svg>`;
}

async function resolveBookCover(book) {
  if (book.coverResolved) return;
  book.coverResolved = true;
  try {
    const q = encodeURIComponent(`intitle:${book.title} inauthor:${book.author}`);
    const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${q}&maxResults=1`);
    if (!res.ok) return;
    const data = await res.json();
    const links = data.items && data.items[0] && data.items[0].volumeInfo && data.items[0].volumeInfo.imageLinks;
    const thumb = links && (links.thumbnail || links.smallThumbnail);
    if (thumb) {
      book.coverUrl = thumb.replace('http://', 'https://').replace('&edge=curl', '');
      renderView();
    }
  } catch (e) {}
}

function hydrateAllBookCovers() {
  books.forEach(b => resolveBookCover(b));
}

/* ==========================================================================
   UTILITÁRIOS & RENDERIZAÇÃO DE CAPAS
   ========================================================================== */
function esc(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function showToast(msg) {
  const el = document.getElementById('toast-box');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function getBook(id) {
  return books.find(b => b.id === id) || books[0];
}

function getUserInitials(name) {
  const parts = String(name || 'Leitora').trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function renderCoverContent(book) {
  const art = book.illustrationSvg || createDynamicCoverSvg(book.title, book.author, book.title.length);
  const img = book.coverUrl
    ? `<img src="${esc(book.coverUrl)}" alt="${esc(book.title)}" loading="lazy" onerror="this.remove()">`
    : '';
  return `${art}${img}`;
}

function go(newRoute, bookId = null) {
  if (bookId) selectedBookId = bookId;
  route = newRoute;
  readerState.toolsOpen = false;
  renderNavigation();
  renderView();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ==========================================================================
   UPLOAD DE PDF / EPUB COM EXTRAÇÃO AUTOMÁTICA DE CAPA
   ========================================================================== */
async function handleBookFileUpload(file) {
  if (!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const cleanTitle = file.name.replace(/\.(pdf|epub)$/i, '').replace(/[_-]+/g, ' ').trim();
  const fileUrl = URL.createObjectURL(file);

  addBookState.isExtracting = true;
  renderView();

  let extractedCover = '';
  let detectedTitle = cleanTitle;
  let detectedAuthor = 'Documento Digital';
  let pdfDocInstance = null;
  let totalPages = 0;

  try {
    if (ext === 'pdf' && window.pdfjsLib) {
      const arrayBuffer = await file.arrayBuffer();
      pdfDocInstance = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      totalPages = pdfDocInstance.numPages;

      try {
        const meta = await pdfDocInstance.getMetadata();
        if (meta && meta.info) {
          if (meta.info.Title && meta.info.Title.trim().length > 2) detectedTitle = meta.info.Title.trim();
          if (meta.info.Author && meta.info.Author.trim().length > 1) detectedAuthor = meta.info.Author.trim();
        }
      } catch (e) {}

      const page1 = await pdfDocInstance.getPage(1);
      const viewport = page1.getViewport({ scale: 1.1 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page1.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      extractedCover = canvas.toDataURL('image/jpeg', 0.85);
    } else if (ext === 'epub' && window.ePub) {
      const book = ePub(fileUrl);
      const meta = await book.loaded.metadata;
      if (meta && meta.title) detectedTitle = meta.title;
      if (meta && meta.creator) detectedAuthor = meta.creator;
      const cover = await book.coverUrl();
      if (cover) extractedCover = cover;
    }
  } catch (err) {}

  addBookState.isExtracting = false;
  addBookState.detectedFile = {
    title: detectedTitle || 'Meu Livro Digital',
    author: detectedAuthor,
    coverUrl: extractedCover,
    fileUrl,
    fileType: ext === 'epub' ? 'epub' : 'pdf',
    pdfDoc: pdfDocInstance,
    totalPages
  };

  if (!extractedCover) {
    resolveBookCover(addBookState.detectedFile);
  }
  renderView();
  showToast('Capa original identificada!');
}

function confirmDetectedBook(openNow = true) {
  const det = addBookState.detectedFile;
  if (!det) return;
  const newBook = {
    id: 'bk_' + Date.now(),
    title: det.title.trim() || 'Livro Digital',
    author: det.author.trim() || 'Autora',
    progress: 5,
    status: 'Lendo',
    favorite: false,
    rating: '5.0',
    reviewsCount: 'Novo',
    genres: [det.fileType.toUpperCase()],
    coverUrl: det.coverUrl || '',
    fallbackBg: 'linear-gradient(155deg, #7A3B1E 0%, #3D2314 100%)',
    synopsis: 'Documento importado para leitura no Mandacaru de Letras.',
    quote: `“Leitura de ${det.title} no meu cantinho literário.”`
  };
  books.unshift(newBook);

  readerState.bookId = newBook.id;
  readerState.uploadedFileUrl = det.fileUrl;
  readerState.uploadedFileType = det.fileType;
  readerState.pdfDoc = det.pdfDoc;
  readerState.pdfPageNum = 1;
  readerState.pdfTotalPages = det.totalPages || 1;

  addBookState.detectedFile = null;
  if (openNow) {
    go('reader', newBook.id);
  } else {
    showToast('Livro salvo na estante!');
    go('library');
  }
}

function saveNewBookToShelf() {
  const title = addBookState.manualTitle.trim();
  const author = addBookState.manualAuthor.trim();
  if (!title) {
    showToast('Digite o título do livro.');
    return;
  }
  const newBook = {
    id: 'bk_' + Date.now(),
    title,
    author: author || 'Autora',
    progress: addBookState.manualStatus === 'Lido' ? 100 : 0,
    status: addBookState.manualStatus,
    favorite: false,
    rating: '5.0',
    reviewsCount: '1',
    genres: ['Leitura'],
    coverUrl: '',
    fallbackBg: 'linear-gradient(155deg, #7A3B1E 0%, #3D2314 100%)',
    synopsis: 'Adicionado à sua estante no Mandacaru de Letras.',
    quote: `“Uma nova história na estante: ${title}.”`
  };
  books.unshift(newBook);
  resolveBookCover(newBook);
  addBookState.manualTitle = '';
  addBookState.manualAuthor = '';
  showToast('Livro adicionado à estante!');
  go('library');
}

/* ==========================================================================
   LEITOR IMERSIVO & PAGINAÇÃO PDF.JS
   ========================================================================== */
function openReaderForBook(id) {
  readerState.bookId = id;
  go('reader');
}

async function renderCurrentPdfPage() {
  const canvas = document.getElementById('pdf-render-canvas');
  if (!canvas || !readerState.pdfDoc) return;
  try {
    const page = await readerState.pdfDoc.getPage(readerState.pdfPageNum);
    const viewport = page.getViewport({ scale: readerState.pdfScale });
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  } catch (e) {}
}

function changePdfPage(delta) {
  if (!readerState.pdfDoc) return;
  const next = readerState.pdfPageNum + delta;
  if (next < 1 || next > readerState.pdfTotalPages) return;
  readerState.pdfPageNum = next;
  const b = getBook(readerState.bookId);
  b.progress = Math.round((next / readerState.pdfTotalPages) * 100);
  renderView();
}

function setReaderPaper(bg, fg) {
  readerState.paperBg = bg;
  readerState.paperFg = fg;
  renderView();
}

function changeFontSize(delta) {
  readerState.fontSize = Math.min(24, Math.max(14, readerState.fontSize + delta));
  renderView();
}

function highlightSelectedText() {
  const sel = window.getSelection();
  const text = sel ? sel.toString().trim() : '';
  if (!text) {
    showToast('Selecione uma frase no texto primeiro.');
    return;
  }
  readerState.highlightedQuote = `“${text}”`;
  try {
    const range = sel.getRangeAt(0);
    const mark = document.createElement('mark');
    mark.style.background = '#FDE68A';
    mark.style.padding = '1px 4px';
    mark.style.borderRadius = '4px';
    range.surroundContents(mark);
    sel.removeAllRanges();
    showToast('Trecho destacado!');
  } catch (e) {
    showToast('Trecho salvo para o Story!');
  }
}

function stampStickerOnPage(stickerId) {
  const slots = [
    { top: '12px', right: '14px' },
    { bottom: '14px', right: '16px' },
    { top: '44%', left: '10px' },
    { bottom: '14px', left: '14px' }
  ];
  const pos = slots[readerState.stickers.length % slots.length];
  readerState.stickers.push({ id: Date.now(), stickerId, ...pos });
  renderView();
}

function removePageSticker(id) {
  readerState.stickers = readerState.stickers.filter(s => s.id !== id);
  renderView();
}

          <div style="display:flex;justify-content:space-between;align-items:center">
            <h3 class="serif" style="margin:0">Estúdio de Stories (9:16)</h3>

          <button class="btn-pill" onclick="exportStoryAsPng()">${uiIcon('download', 15, '#FFF9EB')} Baixar PNG 9:16</button>
        </div>

function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
}

function exportStoryAsPng() {
  const b = getBook(storyState.bookId);
  const canvas = document.createElement('canvas');
  canvas.width = 1080;
  canvas.height = 1920;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = storyState.bg;
  ctx.fillRect(0, 0, 1080, 1920);
  ctx.fillStyle = storyState.fg;
  ctx.font = 'bold 34px sans-serif';
  ctx.fillText('MANDACARU DE LETRAS', 90, 140);
  ctx.font = 'italic 44px Georgia, serif';
  ctx.fillText(storyState.quote.slice(0, 42) + '...', 90, 920);
  ctx.font = 'bold 36px sans-serif';
  ctx.fillText(`${b.title} — ${b.author}`, 90, 1040);

  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = `mandacaru-story-${b.id}.png`;
  a.click();
  showToast('Imagem PNG 9:16 baixada!');
}

function boot() {
  renderNavigation();
  renderView();
  hydrateAllBookCovers();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
